name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax:
    name: PowerShell syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every .ps1
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $failed++
              Write-Host "::error file=$($_.FullName)::Parse errors in $($_.Name)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  protected-list:
    name: Protected-list guard tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify critical packages can never be removed
        shell: pwsh
        run: |
          . ./scripts/helpers/BloatData.ps1
          $mustProtect = @(
            'Microsoft.WindowsStore'
            'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe'
            'Microsoft.VCLibs.140.00'
            'Microsoft.UI.Xaml.2.8'
            'Microsoft.NET.Native.Runtime.2.2'
            'Microsoft.SecHealthUI'
            'windows.immersivecontrolpanel'
            'Microsoft.LanguageExperiencePackfr-FR'
            'Microsoft.WindowsAppRuntime.1.5'
            'Microsoft.Windows.StartMenuExperienceHost'
          )
          $mustNotBlock = @(
            'king.com.CandyCrushSaga'
            'Microsoft.Copilot'
            'MicrosoftTeams'
            'Microsoft.BingNews'
            'Microsoft.XboxGamingOverlay'
          )
          $fail = 0
          foreach ($p in $mustProtect) {
            if (-not (Test-Protected $p)) { Write-Host "::error::LEAK - $p is not protected"; $fail++ }
          }
          foreach ($p in $mustNotBlock) {
            if (Test-Protected $p) { Write-Host "::error::OVERBLOCK - $p should be removable"; $fail++ }
          }
          if (-not (Test-DriverRelated 'Realtek High Definition Audio Driver')) {
            Write-Host "::error::Driver detection failed"; $fail++
          }
          if (Test-DriverRelated 'Candy Crush Saga') {
            Write-Host "::error::Driver detection false positive"; $fail++
          }
          Write-Host "Categories: $($Global:BloatCatalog.Keys.Count)"
          Write-Host "Catalog items: $((($Global:BloatCatalog.Values | ForEach-Object {$_.Items.Count}) | Measure-Object -Sum).Sum)"
          if ($fail) { exit 1 }
          Write-Host "All guard tests passed."

  analyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning |
            Format-Table -AutoSize
